<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Santiago Alvarez - Fullstack Engineer">

  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04121f"/>
      <stop offset="45%" stop-color="#062a41"/>
      <stop offset="100%" stop-color="#0a4260"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd4ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7fd4ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wavefill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c6d94"/>
      <stop offset="50%" stop-color="#2b8fbd"/>
      <stop offset="100%" stop-color="#1c6d94"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8fe3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8fe3ff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="280" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <rect width="1000" height="280" fill="url(#deep)"/>

    <g opacity="0.55">
      <polygon points="120,-40 260,-40 200,300 40,300" fill="url(#beam)">
        <animate attributeName="opacity" values="0.35;0.8;0.35" dur="7s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="520,-40 620,-40 590,300 460,300" fill="url(#beam)">
        <animate attributeName="opacity" values="0.7;0.25;0.7" dur="9s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="820,-40 950,-40 900,300 770,300" fill="url(#beam)">
        <animate attributeName="opacity" values="0.4;0.75;0.4" dur="11s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <g fill="#9fe8ff">
      <circle cx="90" cy="300" r="2.5" opacity="0.5">
        <animate attributeName="cy" values="300;-20" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="90;104;90" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="245" cy="300" r="1.8" opacity="0.45">
        <animate attributeName="cy" values="300;-20" dur="12s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="245;232;245" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="415" cy="300" r="3" opacity="0.35">
        <animate attributeName="cy" values="300;-20" dur="10.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="415;428;415" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="300" r="2" opacity="0.5">
        <animate attributeName="cy" values="300;-20" dur="8s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="640;628;640" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="300" r="2.6" opacity="0.4">
        <animate attributeName="cy" values="300;-20" dur="13s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="790;803;790" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="920" cy="300" r="1.6" opacity="0.45">
        <animate attributeName="cy" values="300;-20" dur="11s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="920;908;920" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="300" r="1.4" opacity="0.35">
        <animate attributeName="cy" values="300;-20" dur="14s" begin="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="540" cy="300" r="2.2" opacity="0.3">
        <animate attributeName="cy" values="300;-20" dur="12.5s" begin="6.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.9">
      <animateTransform attributeName="transform" type="translate"
        values="-40,0; 1060,0" dur="26s" repeatCount="indefinite"/>
      <g transform="translate(0,86) scale(0.62)">
        <animateTransform attributeName="transform" type="translate"
          values="0,80; 0,104; 0,80" dur="6s" repeatCount="indefinite" additive="sum"/>
        <path d="M0 0 C -46 -34, -104 -46, -132 -16 C -150 4, -128 40, -70 38 C -40 37, -14 30, 0 16 Z"
              fill="#8ed6f2" opacity="0.92">
          <animate attributeName="d"
            values="M0 0 C -46 -34, -104 -46, -132 -16 C -150 4, -128 40, -70 38 C -40 37, -14 30, 0 16 Z;
                    M0 0 C -46 -16, -104 -14, -132 4 C -150 18, -128 30, -70 30 C -40 30, -14 26, 0 16 Z;
                    M0 0 C -46 -34, -104 -46, -132 -16 C -150 4, -128 40, -70 38 C -40 37, -14 30, 0 16 Z"
            dur="4s" repeatCount="indefinite"/>
        </path>
        <path d="M0 0 C 46 -34, 104 -46, 132 -16 C 150 4, 128 40, 70 38 C 40 37, 14 30, 0 16 Z"
              fill="#8ed6f2" opacity="0.92">
          <animate attributeName="d"
            values="M0 0 C 46 -34, 104 -46, 132 -16 C 150 4, 128 40, 70 38 C 40 37, 14 30, 0 16 Z;
                    M0 0 C 46 -16, 104 -14, 132 4 C 150 18, 128 30, 70 30 C 40 30, 14 26, 0 16 Z;
                    M0 0 C 46 -34, 104 -46, 132 -16 C 150 4, 128 40, 70 38 C 40 37, 14 30, 0 16 Z"
            dur="4s" repeatCount="indefinite"/>
        </path>
        <ellipse cx="0" cy="6" rx="34" ry="26" fill="#a9e4fa"/>
        <path d="M-20 -14 C -26 -30, -20 -40, -12 -34 C -8 -30, -10 -20, -10 -12 Z" fill="#a9e4fa"/>
        <path d="M20 -14 C 26 -30, 20 -40, 12 -34 C 8 -30, 10 -20, 10 -12 Z" fill="#a9e4fa"/>
        <path d="M-6 30 C -8 62, -12 96, -16 124" stroke="#8ed6f2" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M6 30 C 8 62, 12 96, 16 124" stroke="#8ed6f2" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="-12" cy="0" r="3" fill="#04121f"/>
        <circle cx="12" cy="0" r="3" fill="#04121f"/>
      </g>
    </g>

    <g opacity="0.35">
      <animateTransform attributeName="transform" type="translate"
        values="1080,0; -60,0" dur="42s" repeatCount="indefinite"/>
      <g transform="translate(0,54) scale(0.3)">
        <path d="M0 0 C -46 -34, -104 -46, -132 -16 C -150 4, -128 40, -70 38 C -40 37, -14 30, 0 16 Z" fill="#5fb8dd"/>
        <path d="M0 0 C 46 -34, 104 -46, 132 -16 C 150 4, 128 40, 70 38 C 40 37, 14 30, 0 16 Z" fill="#5fb8dd"/>
        <ellipse cx="0" cy="6" rx="34" ry="26" fill="#5fb8dd"/>
        <path d="M0 30 C 0 70, -4 110, -8 140" stroke="#5fb8dd" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <g>
      <text x="500" y="128" text-anchor="middle"
            font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
            font-size="52" font-weight="300" letter-spacing="9" fill="#eaf8ff">
        SANTIAGO ALVAREZ
        <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
      </text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="1.2s" begin="1s" fill="freeze"/>
        <line x1="330" y1="152" x2="670" y2="152" stroke="#4fb3d9" stroke-width="1" opacity="0.5"/>
        <circle cx="500" cy="152" r="14" fill="url(#glow)">
          <animate attributeName="r" values="10;18;10" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="500" cy="152" r="3" fill="#8fe3ff"/>
        <text x="500" y="182" text-anchor="middle"
              font-family="'Consolas', 'SF Mono', 'Courier New', monospace"
              font-size="15" letter-spacing="4" fill="#7fc9e8">
          fullstack engineer
        </text>
      </g>
    </g>

    <g>
      <path fill="url(#wavefill)" opacity="0.30"
        d="M0,232 C 125,206 250,258 375,232 C 500,206 625,258 750,232 C 875,206 1000,258 1125,232 L1125,280 L0,280 Z">
        <animateTransform attributeName="transform" type="translate"
          values="0,0; -250,0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#wavefill)" opacity="0.45"
        d="M0,244 C 125,222 250,266 375,244 C 500,222 625,266 750,244 C 875,222 1000,266 1125,244 L1125,280 L0,280 Z">
        <animateTransform attributeName="transform" type="translate"
          values="-250,0; 0,0" dur="13s" repeatCount="indefinite"/>
      </path>
      <path fill="#0a4260" opacity="0.75"
        d="M0,256 C 125,238 250,274 375,256 C 500,238 625,274 750,256 C 875,238 1000,274 1125,256 L1125,280 L0,280 Z">
        <animateTransform attributeName="transform" type="translate"
          values="0,0; -250,0" dur="17s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect x="0.5" y="0.5" width="999" height="279" rx="14" fill="none" stroke="#2b8fbd" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
