name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: generate svg files
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: SantiagoAlvPer
          outputs: |
            dist/ocean-contribution-grid.svg?color_snake=#4FB3D9&color_dots=#eaf8ff,#8BA9BC,#4FB3D9,#1C6D94,#04121F
            dist/ocean-contribution-grid-dark.svg?palette=github-dark&color_snake=#8FE3FF

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}